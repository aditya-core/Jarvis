# Jarvis — your offline-first personal assistant
# Edit freely. Jarvis reads this on every launch.

jarvis:
  name: Jarvis
  wake_word: "Hey Jarvis"      # your voice wake phrase (any words you like)
  personality: |
    You are Jarvis, a helpful, concise personal assistant.
    Reply briefly and practically. You live on the user's own computer.

# Local AI brain — OPTIONAL. Left disabled: Jarvis works fully in
# rule-based mode (no AI needed for all commands). Enable only if you
# set up llama-server or Ollama later.
llm:
  provider: llamaserver
  base_url: http://localhost:8080/v1
  model: local
  n_ctx: 2048
  timeout: 60
  enabled: false              # set true when llama-server/ollama is running

# Personality & canned phrases live in phrases.yaml — your local
# 'training' library. Edit it, restart Jarvis, done.

voice:
  enabled: true
  stt_model: base              # base | small | medium (smaller = faster)
  tts_engine: pyttsx3          # offline speech (Windows SAPI)

web:
  backend: duckduckgo          # duckduckgo = free, no API key needed

webui:
  enabled: true
  host: 0.0.0.0
  port: 8765                   # Jarvis UI opens at http://localhost:8765

# ---- llama.cpp server launcher (for --start-server) ----
llamaserver:
  exe_path: C:\llamacpp\llama-server.exe        # where YOU extracted the zip
  model_path: C:\models\qwen2.5-1.5b-instruct-q4_k_m.gguf
  port: 8080

data_dir: data                 # notes, reminders, memory, screenshots live here
