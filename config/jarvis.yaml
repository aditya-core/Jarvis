# Jarvis — your offline-first personal assistant
# Edit freely. Jarvis reads this on every launch.

jarvis:
  name: Jarvis
  wake_word: "Hey Jarvis"      # your voice wake phrase (any words you like)
  personality: |
    You are Jarvis, a helpful, concise personal assistant.
    Reply briefly and practically. You live on the user's own computer.

# Local AI brain (Ollama). Fully offline once the model is pulled.
# Install Ollama from https://ollama.com then run:  ollama pull qwen2.5:3b
#
# Model size guide (disk space + RAM while running):
#   qwen2.5:1.5b  ~1 GB  — ultra-light, great for old/weak PCs
#   qwen2.5:3b    ~2 GB  — best balance (default)
#   qwen2.5:7b    ~5 GB  — best chat quality, needs a strong machine
# Switch anytime: edit model below + `ollama pull <model>`.
llm:
  provider: ollama
  base_url: http://localhost:11434
  model: qwen2.5:3b            # any model you pulled works here
  timeout: 60
  enabled: true                # set false to force pure rule-based mode

voice:
  enabled: true
  stt_model: base              # base | small | medium (smaller = faster)
  tts_engine: pyttsx3          # offline speech (Windows SAPI)

web:
  backend: duckduckgo          # duckduckgo = free, no API key needed

webui:
  enabled: true
  host: 0.0.0.0
  port: 8765                   # Jarvis UI opens at http://localhost:8765

data_dir: data                 # notes, reminders, memory, screenshots live here
